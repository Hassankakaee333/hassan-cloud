name: Agent ACP Sandbox Benchmark

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Hassan Cloud benchmark job ID
        required: true
        type: string
      agent_id:
        description: ACP Agent identifier
        required: true
        type: string
      static_evidence_id:
        description: Static registry evidence fingerprint
        required: true
        type: string
      security_verification_job_id:
        description: Completed no-exec security verification job ID
        required: true
        type: string
      version:
        description: Exact verified Agent version
        required: true
        type: string
      source_url:
        description: Exact verified Binary HTTPS URL
        required: true
        type: string
      expected_sha256:
        description: Exact verified Binary SHA-256
        required: true
        type: string
      command:
        description: Registry-declared relative Agent command
        required: true
        type: string
      args_json:
        description: Registry-declared Agent arguments as compact JSON array
        required: true
        type: string
      protocol_version:
        description: ACP initialize protocol version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: frishta-agent-benchmark-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FRISHTA_JOB_ID: ${{ inputs.job_id }}
      FRISHTA_AGENT_ID: ${{ inputs.agent_id }}
      FRISHTA_STATIC_EVIDENCE_ID: ${{ inputs.static_evidence_id }}
      FRISHTA_SECURITY_VERIFICATION_JOB_ID: ${{ inputs.security_verification_job_id }}
      FRISHTA_VERSION: ${{ inputs.version }}
      FRISHTA_SOURCE_URL: ${{ inputs.source_url }}
      FRISHTA_EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      FRISHTA_COMMAND: ${{ inputs.command }}
      FRISHTA_ARGS_JSON: ${{ inputs.args_json }}
      FRISHTA_PROTOCOL_VERSION: ${{ inputs.protocol_version }}
      FRISHTA_BENCHMARK_OUT_DIR: /tmp/frishta-agent-benchmark
      FRISHTA_SANDBOX_IMAGE: ubuntu:24.04
      FRISHTA_HANDSHAKE_TIMEOUT_SECONDS: "15"
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      HASSAN_CALLBACK_SECRET: ""
      HASSAN_API_URL: ""
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark dependency only
        run: pip install httpx==0.28.1

      - name: Prepare fixed sandbox image before untrusted execution
        run: docker pull ubuntu:24.04

      - name: Run one ACP initialize inside isolated container
        id: benchmark
        continue-on-error: true
        run: python scripts/agent_acp_benchmark_runner.py

      - name: Bind evidence to workflow inputs without exposing secrets
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('/tmp/frishta-agent-benchmark/agent-acp-benchmark.json')
          if not path.exists():
              raise SystemExit('benchmark evidence missing')
          report = json.loads(path.read_text(encoding='utf-8'))
          args = json.loads(os.environ['FRISHTA_ARGS_JSON'])
          assert isinstance(args, list)
          assert report.get('agent_id') == os.environ['FRISHTA_AGENT_ID']
          assert report.get('static_evidence_id') == os.environ['FRISHTA_STATIC_EVIDENCE_ID']
          assert report.get('security_verification_job_id') == os.environ['FRISHTA_SECURITY_VERIFICATION_JOB_ID']
          assert report.get('version') == os.environ['FRISHTA_VERSION']
          assert report.get('secrets_used') is False
          report['source_url'] = os.environ['FRISHTA_SOURCE_URL']
          report['command'] = os.environ['FRISHTA_COMMAND']
          report['args'] = args
          report['github_run_id'] = os.environ.get('GITHUB_RUN_ID', '')
          path.write_text(json.dumps(report, indent=2, sort_keys=True), encoding='utf-8')
          print('benchmark evidence binding: PASS')
          PY

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frishta-agent-benchmark-${{ inputs.job_id }}-${{ github.run_id }}
          path: /tmp/frishta-agent-benchmark/agent-acp-benchmark.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download benchmark evidence only
        uses: actions/download-artifact@v4
        with:
          name: frishta-agent-benchmark-${{ inputs.job_id }}-${{ github.run_id }}
          path: /tmp/frishta-agent-benchmark-evidence

      - name: Publish evidence back to Hassan Cloud
        env:
          HASSAN_API_URL: ${{ secrets.HASSAN_API_URL }}
          HASSAN_CALLBACK_SECRET: ${{ secrets.HASSAN_CALLBACK_SECRET }}
          HASSAN_JOB_ID: ${{ inputs.job_id }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          api = os.environ.get('HASSAN_API_URL', '').rstrip('/')
          secret = os.environ.get('HASSAN_CALLBACK_SECRET', '')
          job_id = os.environ['HASSAN_JOB_ID']
          if not api or not secret:
              raise SystemExit('HASSAN_API_URL and HASSAN_CALLBACK_SECRET are required for evidence callback')
          path = Path('/tmp/frishta-agent-benchmark-evidence/agent-acp-benchmark.json')
          request = urllib.request.Request(
              f'{api}/v1/internal/agent-benchmarks/{job_id}/evidence',
              data=path.read_bytes(),
              headers={
                  'Content-Type': 'application/json',
                  'X-Hassan-Callback-Secret': secret,
                  'User-Agent': 'Frishta-Agent-Benchmark-Publisher/1',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  print(response.read().decode('utf-8'))
          except urllib.error.HTTPError as exc:
              print(exc.read().decode('utf-8', errors='replace'))
              raise
          PY

      - name: Fail workflow when benchmark did not pass
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('/tmp/frishta-agent-benchmark-evidence/agent-acp-benchmark.json').read_text(encoding='utf-8')
          )
          if not report.get('passed'):
              raise SystemExit(f"Agent benchmark failed: {(report.get('blockers') or [])[:3]}")
          print('Agent ACP sandbox benchmark passed')
          PY
