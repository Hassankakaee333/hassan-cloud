name: Cloudflare Identity Check

on:
  push:
    branches: ["candidate/cloudflare-identity-check-20260907"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare CI identity without exposing values
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "CLOUDFLARE_IDENTITY=AVAILABLE"
          else
            echo "CLOUDFLARE_IDENTITY=MISSING"
          fi
