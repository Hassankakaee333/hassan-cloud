services:
  - type: web
    name: hassan-cloud
    runtime: docker
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: HASSAN_ENV
        value: production
      - key: HASSAN_DATA_DIR
        value: /data
      - key: HASSAN_BOOTSTRAP_TOKEN
        generateValue: true
    disk:
      name: hassan-data
      mountPath: /data
      sizeGB: 1
