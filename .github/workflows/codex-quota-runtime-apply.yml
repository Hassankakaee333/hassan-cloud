name: Apply Codex quota runtime patch

on:
  push:
    branches: [codex-quota-separate-20260904]
    paths: [".github/patch-trigger/codex-quota-runtime.txt"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex-quota-separate-20260904
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply runtime patch
        run: python .github/scripts/apply_codex_quota_runtime.py
      - name: Verify without invoking Codex
        run: |
          git diff --check
          python -m compileall -q scripts tests
          python - <<'PY'
          import runpy
          t = runpy.run_path('tests/test_codex_quota.py')
          t['test_daily_weekly_monthly_remaining_percentages']()
          t['test_five_hour_is_shown_only_when_returned']()
          print('Codex quota runtime tests: PASS')
          PY
      - name: Cleanup patch machinery and commit
        run: |
          rm -f .github/scripts/apply_codex_quota_runtime.py
          rm -f .github/patch-trigger/codex-quota-runtime.txt
          rm -f .github/workflows/codex-quota-runtime-apply.yml
          git config user.name "Hassan AI CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose Codex quota in runtime"
          git push origin HEAD:codex-quota-separate-20260904
