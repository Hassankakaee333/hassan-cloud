name: Runner Verify

on:
  pull_request:
    paths:
      - "scripts/**"
      - "hassan_cloud/**"
      - "requirements.txt"
      - "Dockerfile"
      - "tests/test_codex_account_snapshot.py"
      - "tests/test_codex_persistent_auth.py"
      - "tests/test_codex_runtime_selection.py"
      - "tests/test_agent_artifact_verify_runner.py"
      - "tests/test_agent_verification_dispatch.py"
      - "tests/test_agent_verification_api.py"
      - ".github/workflows/hassan-job.yml"
      - ".github/workflows/agent-artifact-verify.yml"
      - ".github/workflows/runner-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile runner Python
        run: python -m compileall -q scripts hassan_cloud tests/test_codex_account_snapshot.py tests/test_codex_persistent_auth.py tests/test_codex_runtime_selection.py tests/test_agent_artifact_verify_runner.py tests/test_agent_verification_dispatch.py tests/test_agent_verification_api.py
      - name: Install cloud requirements and Codex SDK for API-shape validation
        run: pip install -r requirements.txt openai-codex
      - name: Verify Codex SDK surface without login or execution
        run: |
          python - <<'PY'
          from openai_codex import Codex, CodexConfig, Sandbox

          assert hasattr(Codex, "login_chatgpt_device_code")
          assert hasattr(Codex, "thread_start")
          assert hasattr(Codex, "models")
          assert hasattr(Codex, "logout")
          CodexConfig(cwd=".", env={"CODEX_HOME": "/tmp/codex-sdk-shape-check"})
          assert Sandbox.workspace_write is not None
          print("Codex SDK API shape: PASS (no login, no model execution)")
          PY
      - name: Verify manual Codex path guard without invoking Codex
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from codex_candidate_self_improve_job import _allowed_source_path

          assert _allowed_source_path("app/src/main/java/ai/hassan/app/ui/HassanApp.kt")
          assert _allowed_source_path("docs/CODEX.md")
          assert not _allowed_source_path(".github/workflows/unsafe.yml")
          assert not _allowed_source_path("app/signing/candidate-ci.keystore")
          assert not _allowed_source_path("secrets.txt")
          print("manual Codex path guard: PASS")
          PY
      - name: Verify production entrypoint exposes Agent verification API
        run: |
          python - <<'PY'
          from hassan_cloud.entrypoint import app
          paths = {route.path for route in app.routes}
          assert "/v1/agent-verifications" in paths
          assert "/v1/agent-verifications/{job_id}" in paths
          assert "/v1/internal/agent-verifications/{job_id}/evidence" in paths
          print("Agent verification entrypoint routes: PASS")
          PY
      - name: Verify cloud runtime guards without invoking providers or Agent code
        run: pytest -q tests/test_codex_persistent_auth.py tests/test_codex_account_snapshot.py tests/test_codex_runtime_selection.py tests/test_agent_artifact_verify_runner.py tests/test_agent_verification_dispatch.py tests/test_agent_verification_api.py
