name: Runner Verify

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "hassan_cloud/**"
      - "requirements.txt"
      - ".github/workflows/hassan-job.yml"
      - ".github/workflows/runner-verify.yml"

concurrency:
  group: hassan-runner-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile runner Python
        run: python -m compileall -q scripts hassan_cloud tests
      - name: Install runner verification dependencies
        run: pip install -r requirements.txt openai-codex
      - name: Verify Radar adapter request and secret isolation
        run: python -m pytest -q tests/test_radar_adapter_job.py
      - name: Prove reviewed Playwright Radar adapter on ephemeral runner
        env:
          HASSAN_CALLBACK_SECRET: "must-not-reach-adapter-child"
          GEMINI_API_KEY: "must-not-reach-adapter-child"
          GITHUB_TOKEN_FOR_TEST: "must-not-reach-adapter-child"
        run: |
          python - <<'PY'
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from radar_adapter_job import execute_playwright_smoke

          report, screenshot, _install_log = execute_playwright_smoke(
              Path(tempfile.mkdtemp(prefix="radar-adapter-ci-"))
          )
          assert report["status"] == "PASS"
          assert report["local_page_interaction"] is True
          assert report["offline_context"] is True
          assert len(screenshot) > 0
          print(
              "Radar Playwright adapter: PASS; offline local page; "
              f"browser={report.get('browser_version')}"
          )
          PY
      - name: Verify Codex SDK surface without login or execution
        run: |
          python - <<'PY'
          from openai_codex import Codex, CodexConfig, Sandbox

          assert hasattr(Codex, "login_chatgpt_device_code")
          assert hasattr(Codex, "thread_start")
          assert hasattr(Codex, "logout")
          CodexConfig(cwd=".", env={"CODEX_HOME": "/tmp/codex-sdk-shape-check"})
          assert Sandbox.workspace_write is not None
          print("Codex SDK API shape: PASS (no login, no model execution)")
          PY
      - name: Verify manual Codex path guard without invoking Codex
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from codex_candidate_self_improve_job import _allowed_source_path

          assert _allowed_source_path("app/src/main/java/ai/hassan/app/ui/HassanApp.kt")
          assert _allowed_source_path("docs/CODEX.md")
          assert not _allowed_source_path(".github/workflows/unsafe.yml")
          assert not _allowed_source_path("app/signing/candidate-ci.keystore")
          assert not _allowed_source_path("secrets.txt")
          print("manual Codex path guard: PASS")
          PY
