name: Hassan Cloud Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Hassan job ID
        required: true
        type: string
      project_id:
        description: Hassan project ID
        required: true
        type: string
      job_type:
        description: Job type (coding, general, android_build, workspace_coding, agentos_android)
        required: true
        type: string

concurrency:
  group: hassan-job-${{ inputs.job_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java for Android builds
        if: inputs.job_type == 'android_build' || inputs.job_type == 'agentos_android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: inputs.job_type == 'android_build' || inputs.job_type == 'agentos_android'
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        if: inputs.job_type == 'android_build' || inputs.job_type == 'agentos_android'
        run: yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true

      - name: Install Android SDK packages
        if: inputs.job_type == 'agentos_android'
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        if: inputs.job_type == 'android_build' || inputs.job_type == 'agentos_android'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install runner dependencies
        run: pip install -r requirements.txt

      - name: Run Hassan job
        env:
          HASSAN_JOB_ID: ${{ inputs.job_id }}
          HASSAN_PROJECT_ID: ${{ inputs.project_id }}
          HASSAN_JOB_TYPE: ${{ inputs.job_type }}
          HASSAN_API_URL: ${{ secrets.HASSAN_API_URL }}
          HASSAN_CALLBACK_SECRET: ${{ secrets.HASSAN_CALLBACK_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/github_job_runner.py

      - name: Upload workspace artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hassan-job-${{ inputs.job_id }}
          path: |
            /tmp/hassan-job-out/**
          if-no-files-found: ignore
          compression-level: 0

      - name: Register durable artifact metadata and complete job
        if: success()
        env:
          HASSAN_JOB_ID: ${{ inputs.job_id }}
          HASSAN_PROJECT_ID: ${{ inputs.project_id }}
          HASSAN_JOB_TYPE: ${{ inputs.job_type }}
          HASSAN_API_URL: ${{ secrets.HASSAN_API_URL }}
          HASSAN_CALLBACK_SECRET: ${{ secrets.HASSAN_CALLBACK_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          HASSAN_RUNNER_MODE: finalize
        run: python scripts/github_job_runner.py

      - name: Report workflow failure
        if: failure()
        env:
          HASSAN_JOB_ID: ${{ inputs.job_id }}
          HASSAN_PROJECT_ID: ${{ inputs.project_id }}
          HASSAN_JOB_TYPE: ${{ inputs.job_type }}
          HASSAN_API_URL: ${{ secrets.HASSAN_API_URL }}
          HASSAN_CALLBACK_SECRET: ${{ secrets.HASSAN_CALLBACK_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          HASSAN_RUNNER_MODE: failure
        run: python scripts/github_job_runner.py
