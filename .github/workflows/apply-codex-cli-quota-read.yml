name: Apply Codex CLI quota read
on:
  push:
    branches: [codex-cli-quota-read-20260904]
    paths: [".github/workflows/apply-codex-cli-quota-read.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-cli-quota-read-20260904
          fetch-depth: 0
      - name: Patch Codex install step
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/hassan-job.yml')
          s = p.read_text(encoding='utf-8')
          old = '''      - name: Install Codex SDK only for an explicitly selected Codex job\n        if: inputs.job_type == 'codex_candidate_self_improve'\n        run: pip install openai-codex\n'''
          new = '''      - name: Install Codex SDK and CLI only for an explicitly selected Codex job\n        if: inputs.job_type == 'codex_candidate_self_improve'\n        run: |\n          pip install openai-codex\n          npm install -g @openai/codex\n          codex --version\n'''
          if old not in s:
              raise SystemExit('Codex install anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q 'npm install -g @openai/codex' .github/workflows/hassan-job.yml
      - name: Commit verified runtime change
        run: |
          rm .github/workflows/apply-codex-cli-quota-read.yml
          git config user.name "Hassan AI CI"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/hassan-job.yml .github/workflows/apply-codex-cli-quota-read.yml
          git diff --cached --check
          git commit -m "fix: install Codex CLI for quota reads"
          git push origin HEAD:codex-cli-quota-read-20260904
